<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>
    <style>
        /* Variables de colores para facilitar la personalización */
        :root {
            --color-primario: #023e8a;
            --color-fondo: #f8f9fa;
            --color-texto: #343a40;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--color-fondo);
            color: var(--color-texto);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .contenedor {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        h1 {
            color: var(--color-primario);
            margin-top: 0;
        }

        p {
            line-height: 1.6;
            color: #6c757d;
        }

        button {
            background-color: var(--color-primario);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #0077b6;
        }

        #mensaje {
            margin-top: 20px;
            font-weight: 600;
            min-height: 24px; /* Evita que la página salte al aparecer el texto */
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Estructura Base</h1>
        <p>Esta es una plantilla inicial. Puedes modificar este contenedor principal para desarrollar tus interfaces o probar lógica en JavaScript.</p>
        
        <button id="btn-accion">Probar Script</button>
        <p id="mensaje"></p>
    </div>

    <script>
        // Lógica sencilla de JavaScript
        const boton = document.getElementById('btn-accion');
        const mensaje = document.getElementById('mensaje');

        boton.addEventListener('click', () => {
            if (mensaje.textContent === '') {
                mensaje.textContent = '¡El evento click funciona perfectamente!';
                mensaje.style.color = '#2a9d8f';
                boton.textContent = 'Ocultar mensaje hecho';
            } else {
                mensaje.textContent = '';
                boton.textContent = 'Probar Script';
            }
        });
    </script>

</body>
</html>
